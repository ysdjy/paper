# Stage-3 damping pilot config (v1).
# Single hidden axis: drawer joint DAMPING, fixed per session, never in ordinary model input.
# damping_levels values are FINALIZED from damping_micro_sweep_v2 (low/mid/high, non-degenerate).
# theta_ranges are the FROZEN capability-map band (drawer_theta_frozen_v2.yaml); placeholder = schema ranges.

run_prefix: damping_pilot

drawers: [middle_drawer]              # single-drawer core validation first (cleanest from Stage-0)

damping_levels:                       # from damping_micro_sweep_v2 (nominal: 3/20 succeed, >=60 detach).
  - {id: L1_low,  value: 3.0}          # easy (baseline); nominal final ~0.196
  - {id: L2_mid,  value: 20.0}         # moderate resistance; nominal final ~0.188 (still succeeds)
  - {id: L3_high, value: 40.0}         # near detach threshold; only aggressive candidates open it

theta_ranges:                         # FROZEN from capability_map_v2_20260702_231522 (middle 0.58 mix).
  grasp_offset_local_y: [-0.06, 0.06]  # dominant driver: center=success, |y| large=edge-miss failure
  max_pos_step: [0.008, 0.035]
  pull_lead: [0.03, 0.14]

targets: [0.20]                       # single target for the pilot (add levels in formal stage)

sessions_per_condition: 3             # 3 damping x 3 sessions = 9 sessions
n_probes: 3
candidate_groups_per_session: 1
candidates_per_group: 5
# per session: 3 probes + 5 candidates = 8 eps; 9 sessions = 72 eps (in 60-120 pilot range)
seed: 11
max_steps: 1800
